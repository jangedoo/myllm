[project]
name = "myllm"
version = "0.1.0"
description = "My LLM"
readme = "README.md"
authors = [
    { name = "Sanjaya Subedi", email = "jangedoo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerator>=2025.11.11",
    "datasets>=5.0.1",
    "einops>=0.8.2",
    "lets-plot>=4.11.0",
    "pandas>=3.0.5",
    "pyarrow~=24.0.0",
    "torch>=2.14.0",
    "torchao>=0.18.0",
    "transformers>=5.15.1",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "ruff>=0.16.4",
]

[project.scripts]
myllm = "myllm.cli:cli"
